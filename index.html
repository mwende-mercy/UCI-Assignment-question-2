<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Images &amp; Multimedia Gallery</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f3f4f6; color: #111827; }
    header, footer { background: #1e3a8a; color: #fff; text-align: center; padding: 1.2rem; }
    main { max-width: 1000px; margin: auto; padding: 1rem; }
    h2 { border-bottom: 3px solid #f59e0b; padding-bottom: .3rem; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .gallery figure, .gallery > img, .gallery picture { margin: 0; }
    .gallery img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; display: block; }
    figure { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
    figcaption { padding: .6rem; font-size: .9rem; font-style: italic; text-align: center; }
    .video-wrap { position: relative; padding-bottom: 56.25%; height: 0; }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>My Multimedia Gallery</h1>
    <p>Images, video and audio in HTML5</p>
  </header>

  <main>
    <section>
      <h2>Image Gallery</h2>
      <div class="gallery">

        <!-- Local image + <picture> bonus: small image on mobile, large on desktop -->
        <figure>
          <picture>
            <source media="(max-width: 600px)" srcset="images/local-small.svg">
            <source media="(min-width: 601px)" srcset="images/local-large.svg">
            <img src="images/local-large.svg" alt="Stylised sunset over dark mountains with a glowing yellow sun">
          </picture>
          <figcaption>Figure 1: A local image served responsively with the &lt;picture&gt; element.</figcaption>
        </figure>

        <!-- Local image -->
        <img src="images/local-2.svg" alt="Abstract green shapes: circles and a square on a dark green background">

        <!-- External images -->
        <figure>
          <img src="https://picsum.photos/id/1015/800/500" alt="A river winding through a green valley surrounded by mountains" loading="lazy">
          <figcaption>Figure 2: External image.</figcaption>
        </figure>

        <img src="https://picsum.photos/id/1043/800/500" alt="Calm lake at dusk with soft light reflecting on the water" loading="lazy">
      </div>
    </section>

   
<section class="video-section">
    <h2>Featured YouTube Video</h2>

    <div class="video-container">
        <iframe
            src="https://www.youtube.com/embed/ScMzIvxBSi4?controls=1&rel=0"
            title="Featured YouTube Video"
            width="800"
            height="450"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>
    </div>
</section>

<style>
    .video-section {
        text-align: center;
        padding: 25px 15px;
        background-color: #f5f5f5;
        border-radius: 12px;
        margin: 20px auto;
    }

    .video-section h2 {
        color: #222;
        margin-bottom: 20px;
        font-size: 28px;
    }

    .video-container {
        width: 100%;
        max-width: 800px;
        aspect-ratio: 16 / 9;
        margin: auto;
    }

    .video-container iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 10px;
    }
</style>


    <section>
      <h2>Audio</h2>
      <audio controls preload="none">
        <source src="audio/sample-3s.mp3" type="audio/mpeg">
        <!-- <source src="https://www.w3schools.com/html/horse.ogg" type="audio/ogg"> -->
        Your browser does not support the audio element.
      </audio>
    </section>
  </main>

  <footer><p>&copy; 2026 Group Work – Images &amp; Multimedia Integration</p></footer>
</body>
</html>
